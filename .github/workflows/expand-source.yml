name: Expand DocuMind source into repository root

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/expand-source.yml"

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract source files
        run: |
          test -f documind-ai-source.tar.gz
          mkdir -p /tmp/documind-source
          tar -xzf documind-ai-source.tar.gz -C /tmp/documind-source
          test -d /tmp/documind-source/documind-ai
          cp -a /tmp/documind-source/documind-ai/. .
          rm documind-ai-source.tar.gz

      - name: Commit expanded project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Expand DocuMind AI source into repository root"
          git push
